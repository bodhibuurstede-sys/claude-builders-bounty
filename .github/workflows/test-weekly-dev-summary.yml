name: Test weekly dev summary

on:
  push:
    branches:
      - codex/n8n-weekly-dev-summary
  pull_request:
    paths:
      - 'bounties/005-weekly-dev-summary/**'
      - '.github/workflows/test-weekly-dev-summary.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static workflow contract
        run: python bounties/005-weekly-dev-summary/test_workflow.py

      - name: Start deterministic mock APIs
        run: |
          node bounties/005-weekly-dev-summary/mock-server.cjs > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:18765/health && exit 0
            sleep 1
          done
          cat mock-server.log
          exit 1

      - name: Install n8n CLI
        run: npm install --global n8n@latest

      - name: Import workflow into n8n
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n
          N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
        run: n8n import:workflow --input=bounties/005-weekly-dev-summary/weekly-dev-summary.json

      - name: Execute workflow in real n8n against mock services
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n
          N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
          N8N_RUNNERS_ENABLED: 'false'
          GITHUB_REPO: example/acme
          SUMMARY_LANGUAGE: EN
          GITHUB_API_BASE_URL: http://127.0.0.1:18765
          ANTHROPIC_API_BASE_URL: http://127.0.0.1:18765
          DESTINATION_WEBHOOK_URL: http://127.0.0.1:18765/discord
          GITHUB_TOKEN: test-token
          ANTHROPIC_API_KEY: test-key
          MOCK_CAPTURE: /tmp/discord-payload.json
        run: |
          set -o pipefail
          n8n execute --id=WDSBounty005 2>&1 | tee n8n-execution.log
          test -s /tmp/discord-payload.json
          grep -q 'Weekly update' /tmp/discord-payload.json

      - name: Render execution evidence
        if: always()
        run: |
          python -m pip install --quiet Pillow
          python bounties/005-weekly-dev-summary/render-execution-evidence.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-dev-summary-evidence
          path: |
            n8n-execution.log
            execution-evidence.png
            mock-server.log
          if-no-files-found: warn
